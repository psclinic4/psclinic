<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Clinic - Payload Loader</title>
<link rel="stylesheet" href="../style.css">
<style>
  :root {
    --primary-color: #0072CE; /* PlayStation Blue */
    --accent-color: #00D2FF;
    --bg-color: #0d0f12;
    --card-bg: rgba(255, 255, 255, 0.05);
    --text-color: #ffffff;
    --text-dim: #a0a0a0;
  }

  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at center, #1a233a 0%, #0d0f12 100%);
    color: var(--text-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 95vh;
    box-sizing: border-box;
    text-align: center;
  }

  .header {
    margin-top: 20px;
  }

  .logo {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 0 0 15px rgba(0, 114, 206, 0.6);
  }

  .logo span {
    color: var(--accent-color);
  }

  .sub-title {
    font-size: 16px;
    color: var(--text-dim);
    margin-top: 5px;
  }

  .main-container {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 40px 20px;
    max-width: 650px;
    margin: auto;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    backdrop-filter: blur(4px);
    width: 90%;
  }

  #msgs {
    font-size: 26px;
    font-weight: 600;
    color: #ffffff;
    margin: 0 0 15px 0;
  }

  .info-text {
    font-size: 18px;
    color: var(--text-dim);
    margin: 0;
  }

  .hidden-elements {
    opacity: 0;
    position: absolute;
    pointer-events: none;
  }
</style>
</head>
<body>

  <!-- Header Section -->
  <div class="header">
    <div class="logo">PS <span>CLINIC</span></div>
    <div class="sub-title">Payload Injector & Loader</div>
  </div>

  <!-- Status / Messages Container -->
  <div class="main-container">
    <h1 id="msgs">Loading Payload... Please Wait !!!</h1>
    <p class="info-text">This will take between 20 and 40 seconds ...</p>
  </div>

  <!-- Hidden DOM Elements required by payload execution -->
  <div class="hidden-elements">
    <p><i>Italic text</i></p>
    <table>
      <tr>
        <th>H1</th>
        <th>H2</th>
        <th>H3</th>
      </tr>
      <tr>
        <td>text</td>
        <td><input value="text"/></td>
        <td><button>text</button></td>
      </tr>
    </table>
  </div>

  <!-- Script Execution -->
  <script>
    function loadScript(path) {
      var xhr = new XMLHttpRequest(path);
      xhr.open("GET", path, false);
      xhr.send('');
      return xhr.responseText;
    }

    setTimeout(function() {
      eval.call(window, loadScript('netcat.js')
      + loadScript('exploit.js')
      + loadScript('malloc.js')
      + loadScript('rop2.js')
      + loadScript('syscalls.js')
      + loadScript('syscalls2.js')
      + loadScript('payload.js')
      + loadScript('relocator.js')
      + loadScript('frontend.js'));
      
      var qElem = document.getElementById('q');
      if (qElem) {
        qElem.innerHTML = 'Some other text';
      }
    }, 50);
  </script>

</body>
</html>
